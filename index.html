<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Where'd You Land?</title>
<style>
  :root{
    --sky-top:#1B2838;
    --sky-bot:#3D5470;
    --sand:#E8D5B7;
    --sand-dim:#d9c4a0;
    --flare:#E0703A;
    --signal:#F2B84B;
    --pine:#1a2b22;
    --pine-light:#22392F;
    --ink:#0f1720;
    --paper:#f4ecdb;
    --line:rgba(232,213,183,0.18);
    --good:#7CB88F;
    --bad:#D9636B;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:var(--ink);
    font-family:'Founders Grotesk','Helvetica Neue',Arial,sans-serif;
    overflow:hidden;
  }

  @font-face{
    font-family:'Display';
    src:local('Arial Black');
  }

  body{
    font-family:'Arial',sans-serif;
    color:var(--sand);
  }

  .display{
    font-family:'Arial Narrow','Helvetica Neue Condensed',Arial,sans-serif;
    font-weight:900;
    letter-spacing:0.01em;
    text-transform:uppercase;
  }

  #app{
    position:relative;
    width:100vw;
    height:100vh;
    background:linear-gradient(180deg,var(--sky-top) 0%, var(--sky-bot) 55%, #4a6580 100%);
    display:flex;
    flex-direction:column;
  }

  /* ---------- TOP BAR ---------- */
  #topbar{
    position:relative;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 22px;
    background:linear-gradient(180deg, rgba(15,23,32,0.85), rgba(15,23,32,0));
    pointer-events:none;
  }

  #topbar > *{ pointer-events:auto; }

  .title-block{
    display:flex;
    flex-direction:column;
    line-height:1;
  }

  .title-block .brand{
    font-size:22px;
    font-weight:900;
    letter-spacing:0.02em;
    text-transform:uppercase;
    color:var(--sand);
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .title-block .brand .q{
    color:var(--signal);
    font-size:22px;
  }
  .title-block .sub{
    margin-top:3px;
    font-size:10.5px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:rgba(232,213,183,0.55);
  }

  .hud{
    display:flex;
    align-items:center;
    gap:14px;
  }

  .pill{
    background:rgba(15,23,32,0.55);
    border:1px solid rgba(232,213,183,0.25);
    border-radius:999px;
    padding:8px 16px;
    font-size:13px;
    letter-spacing:0.04em;
    display:flex;
    align-items:center;
    gap:8px;
    backdrop-filter:blur(6px);
  }

  .pill .label{
    text-transform:uppercase;
    font-size:9.5px;
    letter-spacing:0.1em;
    color:rgba(232,213,183,0.5);
  }
  .pill .value{
    font-weight:800;
    font-family:'Courier New',monospace;
    font-size:15px;
    color:var(--signal);
  }

  /* ---------- MAP STAGE ---------- */
  #stage{
    position:relative;
    flex:1;
    overflow:hidden;
  }

  #mapWrap{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  #worldSvg{
    width:100%;
    height:100%;
    cursor:crosshair;
    display:block;
  }

  #worldSvg .country{
    fill:var(--sand);
    stroke:var(--sky-top);
    stroke-width:0.6;
    transition:fill 0.15s ease;
  }
  #worldSvg .country:hover{
    fill:var(--sand-dim);
  }
  #worldSvg .ocean{
    fill:url(#oceanGrad);
  }

  .stars{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:0.5;
  }

  /* ---------- MARKERS ---------- */
  .marker{
    position:absolute;
    transform:translate(-50%,-100%);
    pointer-events:none;
    z-index:15;
  }

  .marker svg{ display:block; overflow:visible; }

  .marker.guess-marker{
    animation:dropIn 0.55s cubic-bezier(.34,1.56,.64,1) both;
  }

  @keyframes dropIn{
    0%{ transform:translate(-50%,-100%) translateY(-140px); opacity:0; }
    70%{ opacity:1; }
    100%{ transform:translate(-50%,-100%) translateY(0); opacity:1; }
  }

  .marker.answer-marker{
    animation:popIn 0.4s cubic-bezier(.34,1.56,.64,1) both;
    animation-delay:0.15s;
  }
  @keyframes popIn{
    0%{ transform:translate(-50%,-100%) scale(0); opacity:0; }
    100%{ transform:translate(-50%,-100%) scale(1); opacity:1; }
  }

  #flightPath{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:12;
  }
  #flightPath line{
    stroke:var(--signal);
    stroke-width:2;
    stroke-dasharray:6 6;
    opacity:0;
  }
  #flightPath line.show{
    animation:dashIn 0.6s ease-out 0.3s forwards;
  }
  @keyframes dashIn{
    from{ opacity:0; stroke-dashoffset:24; }
    to{ opacity:0.85; stroke-dashoffset:0; }
  }

  /* ---------- PROMPT CARD (target name) ---------- */
  #promptCard{
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    background:rgba(15,23,32,0.72);
    border:1px solid rgba(232,213,183,0.25);
    backdrop-filter:blur(8px);
    border-radius:14px;
    padding:12px 26px;
    text-align:center;
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
  }
  #promptCard .eyebrow{
    font-size:9.5px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--signal);
    margin-bottom:4px;
  }
  #promptCard .target{
    font-size:19px;
    font-weight:800;
    color:var(--sand);
    letter-spacing:0.01em;
  }

  /* ---------- BOTTOM CONTROL BAR ---------- */
  #bottombar{
    position:relative;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px 20px 22px;
    background:linear-gradient(0deg, rgba(15,23,32,0.85), rgba(15,23,32,0));
  }

  .btn{
    font-family:inherit;
    font-weight:800;
    letter-spacing:0.04em;
    text-transform:uppercase;
    font-size:14px;
    padding:14px 36px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    transition:transform 0.12s ease, box-shadow 0.12s ease, opacity 0.2s ease;
    box-shadow:0 6px 18px rgba(0,0,0,0.3);
  }
  .btn:active{ transform:translateY(1px) scale(0.98); }
  .btn:disabled{
    opacity:0.35;
    cursor:not-allowed;
    box-shadow:none;
  }

  .btn-primary{
    background:var(--flare);
    color:#fff5ea;
  }
  .btn-primary:not(:disabled):hover{
    box-shadow:0 8px 22px rgba(224,112,58,0.45);
    transform:translateY(-1px);
  }

  .btn-secondary{
    background:transparent;
    color:var(--sand);
    border:1.5px solid rgba(232,213,183,0.4);
  }
  .btn-secondary:hover{
    border-color:var(--sand);
  }

  .hint-text{
    position:absolute;
    bottom:26px;
    left:24px;
    z-index:20;
    font-size:12px;
    color:rgba(232,213,183,0.55);
    letter-spacing:0.03em;
    max-width:220px;
    line-height:1.4;
    pointer-events:none;
  }

  /* ---------- RESULT SLIDE-UP PANEL ---------- */
  #resultPanel{
    position:absolute;
    left:0; right:0; bottom:0;
    z-index:30;
    background:var(--paper);
    color:var(--ink);
    border-radius:22px 22px 0 0;
    box-shadow:0 -12px 40px rgba(0,0,0,0.4);
    transform:translateY(100%);
    transition:transform 0.45s cubic-bezier(.16,1,.3,1);
    padding:26px 30px 30px;
  }
  #resultPanel.open{ transform:translateY(0); }

  .result-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:20px;
    margin-bottom:18px;
  }

  .result-name{
    font-size:22px;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:0.01em;
    color:var(--pine-light);
    max-width:60%;
  }

  .result-stats{
    display:flex;
    gap:22px;
  }

  .stat{
    text-align:right;
  }
  .stat .num{
    font-family:'Courier New',monospace;
    font-size:30px;
    font-weight:800;
    line-height:1;
    color:var(--flare);
  }
  .stat .num.points{ color:var(--pine-light); }
  .stat .lbl{
    font-size:9.5px;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:rgba(15,23,32,0.5);
    margin-top:4px;
  }

  .score-bar-track{
    width:100%;
    height:8px;
    background:rgba(15,23,32,0.12);
    border-radius:999px;
    overflow:hidden;
    margin-bottom:22px;
  }
  .score-bar-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, var(--flare), var(--signal));
    border-radius:999px;
    transition:width 0.8s cubic-bezier(.16,1,.3,1);
  }

  .result-actions{
    display:flex;
    justify-content:flex-end;
  }

  /* ---------- START / END OVERLAY ---------- */
  #overlay{
    position:absolute;
    inset:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(ellipse at 50% 30%, rgba(61,84,112,0.95), rgba(15,23,32,0.98));
    text-align:center;
    padding:20px;
  }
  #overlay.hidden{ display:none; }

  .overlay-card{
    max-width:480px;
  }

  .overlay-mark{
    width:64px;
    height:64px;
    margin:0 auto 22px;
  }

  .overlay-title{
    font-size:40px;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:0.01em;
    line-height:1.05;
    color:var(--sand);
    margin-bottom:6px;
  }
  .overlay-title .q{ color:var(--signal); }

  .overlay-sub{
    font-size:14px;
    color:rgba(232,213,183,0.65);
    line-height:1.6;
    margin-bottom:30px;
  }

  .final-score{
    font-family:'Courier New',monospace;
    font-size:64px;
    font-weight:800;
    color:var(--signal);
    line-height:1;
    margin-bottom:6px;
  }
  .final-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.12em;
    color:rgba(232,213,183,0.55);
    margin-bottom:28px;
  }

  .rank-list{
    text-align:left;
    max-width:340px;
    margin:0 auto 30px;
    font-family:'Courier New',monospace;
    font-size:13px;
    color:rgba(232,213,183,0.75);
  }
  .rank-row{
    display:flex;
    justify-content:space-between;
    padding:6px 4px;
    border-bottom:1px solid rgba(232,213,183,0.12);
  }
  .rank-row:last-child{ border-bottom:none; }
  .rank-row .rn{ color:var(--sand); max-width:70%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rank-row .rp{ color:var(--signal); font-weight:700; }

  @media (max-width:640px){
    .title-block .sub{ display:none; }
    .title-block .brand{ font-size:17px; }
    #topbar{ padding:12px 14px; align-items:flex-start; }
    .hud{ gap:8px; }
    .pill{ padding:6px 10px; flex-direction:column; align-items:center; gap:2px; }
    .pill .label{ font-size:8px; }
    .pill .value{ font-size:13px; }
    #promptCard{ top:64px; padding:9px 16px; max-width:88vw; }
    #promptCard .target{ font-size:15px; }
    .hint-text{ display:none; }
    .overlay-title{ font-size:30px; }
    .final-score{ font-size:48px; }
    .result-name{ font-size:17px; max-width:55%; }
    .stat .num{ font-size:22px; }
    .result-stats{ gap:14px; }
    #bottombar{ padding:12px 16px 18px; }
    .btn{ padding:13px 28px; font-size:13px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
  }
</style>
</head>
<body>

<div id="app">

  <div id="topbar">
    <div class="title-block">
      <div class="brand">WHERE'D YOU LAND<span class="q">?</span></div>
      <div class="sub">Drop a pin. Find out how close you came.</div>
    </div>
    <div class="hud">
      <div class="pill"><span class="label">Round</span><span class="value" id="roundValue">1 / 5</span></div>
      <div class="pill"><span class="label">Score</span><span class="value" id="scoreValue">0</span></div>
    </div>
  </div>

  <div id="stage">

      <div class="target" id="targetName">—</div>

<script>
//COUNTRY_DATA_PLACEHOLDER
const LOCATIONS = [

  {n:'Nairobi, Kenya',lat:-1.2921,lng:36.8219},
  {n:'Buenos Aires, Argentina',lat:-34.6037,lng:-58.3816},

  {n:'Wellington, New Zealand',lat:-41.2865,lng:174.7762},
  {n:'Anchorage, Alaska',lat:61.2181,lng:-149.9003},
  {n:'Ushuaia, Argentina',lat:-54.8019,lng:-68.303},

  {n:'Dubrovnik, Croatia',lat:42.6507,lng:18.0944},

  {n:'Galapagos Islands, Ecuador',lat:-0.9538,lng:-90.9656},
  {n:'Lofoten Islands, Norway',lat:68.15,lng:13.6},
  {n:'Reykjavik Harbor, Iceland',lat:64.15,lng:-21.94},
  {n:'Antarctica Peninsula',lat:-63.2467,lng:-57.0},
  {n:'Ha Long Bay, Vietnam',lat:20.9101,lng:107.1839},
  {n:'Petronas Towers, Kuala Lumpur',lat:3.1579,lng:101.7116},
  {n:'Moscow Kremlin',lat:55.752,lng:37.6175},
  {n:'Seoul, South Korea',lat:37.5665,lng:126.978},
  {n:'Mumbai, India',lat:19.076,lng:72.8777},
  {n:'Cape Town, South Africa',lat:-33.9249,lng:18.4241},
  {n:'Mexico City, Mexico',lat:19.4326,lng:-99.1332},
  {n:'Lima, Peru',lat:-12.0464,lng:-77.0428},
  {n:'Amsterdam, Netherlands',lat:52.3676,lng:4.9041},
  {n:'Marrakesh, Morocco',lat:31.6295,lng:-7.9811}
];
(function(){
  "use strict";

  const TOTAL_ROUNDS = 5;
  const MAX_DIST_KM = 20037; // half of earth's circumference -> worst possible distance
  const svg = document.getElementById('worldSvg');
  const countryGroup = document.getElementById('countryGroup');
  const mapWrap = document.getElementById('mapWrap');
  const flightPathSvg = document.getElementById('flightPath');
  const targetNameEl = document.getElementById('targetName');
  const roundValueEl = document.getElementById('roundValue');
  const scoreValueEl = document.getElementById('scoreValue');
  const guessBtn = document.getElementById('guessBtn');
  const nextBtn = document.getElementById('nextBtn');
  const resultPanel = document.getElementById('resultPanel');
  const resultName = document.getElementById('resultName');
  const resultDistance = document.getElementById('resultDistance');
  const resultPoints = document.getElementById('resultPoints');
  const scoreBarFill = document.getElementById('scoreBarFill');
  const hintText = document.getElementById('hintText');
  const overlay = document.getElementById('overlay');
  const overlayCard = document.getElementById('overlayCard');

  let roundLocations = [];
  let currentRoundIndex = 0;
  let totalScore = 0;
  let roundResults = []; // {name, distance, points}
  let guessLatLng = null; // {lat, lng}
  let guessMarkerEl = null;
  let answerMarkerEl = null;
  let hasGuessed = false;

  // ---------- projection helpers (equirectangular, matches how the SVG paths were built) ----------
  const VB_W = 1000, VB_H = 500;

  function lngLatToSvgXY(lng, lat){
    const x = (lng + 180) / 360 * VB_W;
    const y = (90 - lat) / 180 * VB_H;
    return {x, y};
  }

  function svgPointFromClientEvent(evt){
    const pt = svg.createSVGPoint();
    const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
    const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
    pt.x = clientX;
    pt.y = clientY;
    const screenCTM = svg.getScreenCTM();
    if(!screenCTM) return null;
    const svgP = pt.matrixTransform(screenCTM.inverse());
    return svgP;
  }

  function svgXYToLngLat(x, y){
    const lng = (x / VB_W) * 360 - 180;
    const lat = 90 - (y / VB_H) * 180;
    return {lng, lat};
  }

  // ---------- haversine distance in km ----------
  function haversineKm(lat1, lon1, lat2, lon2){
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI/180;
    const dLon = (lon2 - lon1) * Math.PI/180;
    const a = Math.sin(dLat/2)*Math.sin(dLat/2) +
              Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180) *
              Math.sin(dLon/2)*Math.sin(dLon/2);
    const c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
  }

  // scoring curve: full 1000 at 0km, decays smoothly, ~0 past ~4000km
  function scoreFromDistance(distKm){
    const maxPoints = 1000;
    const scaleKm = 1400; // controls decay steepness
    const raw = maxPoints * Math.exp(-distKm / scaleKm);
    return Math.max(0, Math.round(raw));
  }

  // ---------- marker rendering ----------
  function makeMarkerEl(kind){
    // kind: 'guess' (flare orange) or 'answer' (pine/signal)
    const wrapper = document.createElement('div');
    wrapper.className = 'marker ' + (kind === 'guess' ? 'guess-marker' : 'answer-marker');
    const color = kind === 'guess' ? '#E0703A' : '#F2B84B';
    const strokeColor = kind === 'guess' ? '#7a2f14' : '#8a611c';
    wrapper.innerHTML = `
      <svg width="30" height="42" viewBox="0 0 30 42">
        <path d="M15 41 C15 41 3 24.5 3 15 C3 7.2 8.6 1 15 1 C21.4 1 27 7.2 27 15 C27 24.5 15 41 15 41 Z"
              fill="${color}" stroke="${strokeColor}" stroke-width="1.5"/>
        <circle cx="15" cy="15" r="5.5" fill="#fff5ea"/>
      </svg>
    `;
    return wrapper;
  }

  // Because the SVG uses preserveAspectRatio="xMidYMid meet", the rendered map is
  // letterboxed inside its bounding box. We compute the actual on-screen rect of the
  // viewBox content so markers (positioned absolutely within #mapWrap) line up exactly
  // with the map underneath, regardless of window size/aspect ratio.
  function getMapRenderRect(){
    const bbox = svg.getBoundingClientRect();
    const wrapBox = mapWrap.getBoundingClientRect();
    const svgAspect = VB_W / VB_H;
    const boxAspect = bbox.width / bbox.height;
    let renderW, renderH, offsetX, offsetY;
    if(boxAspect > svgAspect){
      // box wider than viewBox -> letterbox left/right
      renderH = bbox.height;
      renderW = renderH * svgAspect;
      offsetY = 0;
      offsetX = (bbox.width - renderW) / 2;
    } else {
      renderW = bbox.width;
      renderH = renderW / svgAspect;
      offsetX = 0;
      offsetY = (bbox.height - renderH) / 2;
    }
    // offset relative to mapWrap (markers are positioned relative to mapWrap)
    const relLeft = (bbox.left - wrapBox.left) + offsetX;
    const relTop = (bbox.top - wrapBox.top) + offsetY;
    return { relLeft, relTop, renderW, renderH, wrapW: wrapBox.width, wrapH: wrapBox.height };
  }

  function placeMarker(el, lng, lat){
    const {x, y} = lngLatToSvgXY(lng, lat);
    const rect = getMapRenderRect();
    const pxLeft = rect.relLeft + (x / VB_W) * rect.renderW;
    const pxTop = rect.relTop + (y / VB_H) * rect.renderH;
    const xPct = (pxLeft / rect.wrapW) * 100;
    const yPct = (pxTop / rect.wrapH) * 100;
    el.style.left = xPct + '%';
    el.style.top = yPct + '%';
    el._lng = lng;
    el._lat = lat;
  }

  function repositionAllMarkers(){
    if(guessMarkerEl) placeMarker(guessMarkerEl, guessMarkerEl._lng, guessMarkerEl._lat);
    if(answerMarkerEl) placeMarker(answerMarkerEl, answerMarkerEl._lng, answerMarkerEl._lat);
    if(hasGuessed && guessLatLng){
      const loc = roundLocations[currentRoundIndex];
      flightPathSvg.innerHTML = '';
      drawFlightPath(guessLatLng.lng, guessLatLng.lat, loc.lng, loc.lat);
      const line = flightPathSvg.querySelector('line');
      if(line) line.classList.add('show');
    }
  }

  function clearMarkers(){
    if(guessMarkerEl){ guessMarkerEl.remove(); guessMarkerEl = null; }
    if(answerMarkerEl){ answerMarkerEl.remove(); answerMarkerEl = null; }
    flightPathSvg.innerHTML = '';
  }

  function drawFlightPath(guessLng, guessLat, ansLng, ansLat){
    const g = lngLatToSvgXY(guessLng, guessLat);
    const a = lngLatToSvgXY(ansLng, ansLat);
    const ns = 'http://www.w3.org/2000/svg';
    const line = document.createElementNS(ns, 'line');
    line.setAttribute('x1', g.x);
    line.setAttribute('y1', g.y);
    line.setAttribute('x2', a.x);
    line.setAttribute('y2', a.y);
    flightPathSvg.appendChild(line);
    // trigger animation
    requestAnimationFrame(()=>{ line.classList.add('show'); });
  }

  // ---------- game flow ----------
  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function startGame(){
    roundLocations = shuffle(LOCATIONS).slice(0, TOTAL_ROUNDS);
    currentRoundIndex = 0;
    totalScore = 0;
    roundResults = [];
    overlay.classList.add('hidden');
    loadRound();
  }

  function loadRound(){
    hasGuessed = false;
    guessLatLng = null;
    clearMarkers();
    resultPanel.classList.remove('open');
    guessBtn.disabled = true;
    guessBtn.textContent = 'Lock in guess';
    hintText.style.display = '';
    const loc = roundLocations[currentRoundIndex];
    targetNameEl.textContent = loc.n;
    roundValueEl.textContent = (currentRoundIndex+1) + ' / ' + TOTAL_ROUNDS;
    scoreValueEl.textContent = totalScore;
  }

  function onMapClick(evt){
    if(hasGuessed) return;
    const svgP = svgPointFromClientEvent(evt);
    if(!svgP) return;
    if(svgP.x < 0 || svgP.x > VB_W || svgP.y < 0 || svgP.y > VB_H) return;

    const {lng, lat} = svgXYToLngLat(svgP.x, svgP.y);
    guessLatLng = {lng, lat};

    if(guessMarkerEl) guessMarkerEl.remove();
    guessMarkerEl = makeMarkerEl('guess');
    mapWrap.appendChild(guessMarkerEl);
    placeMarker(guessMarkerEl, lng, lat);

    guessBtn.disabled = false;
    hintText.textContent = 'Click again to move your pin, or lock it in.';
  }

  function lockInGuess(){
    if(!guessLatLng || hasGuessed) return;
    hasGuessed = true;
    guessBtn.disabled = true;

    const loc = roundLocations[currentRoundIndex];
    const distKm = haversineKm(guessLatLng.lat, guessLatLng.lng, loc.lat, loc.lng);
    const points = scoreFromDistance(distKm);
    totalScore += points;
    roundResults.push({name: loc.n, distance: distKm, points: points});

    // place answer marker + flight path
    answerMarkerEl = makeMarkerEl('answer');
    mapWrap.appendChild(answerMarkerEl);
    placeMarker(answerMarkerEl, loc.lng, loc.lat);
    drawFlightPath(guessLatLng.lng, guessLatLng.lat, loc.lng, loc.lat);

    // populate result panel
    resultName.textContent = loc.n;
    resultDistance.textContent = Math.round(distKm).toLocaleString();
    resultPoints.textContent = points.toLocaleString();
    scoreValueEl.textContent = totalScore;

    requestAnimationFrame(()=>{
      resultPanel.classList.add('open');
      requestAnimationFrame(()=>{
        scoreBarFill.style.width = Math.min(100, points/10) + '%';
      });
    });

    hintText.style.display = 'none';

    if(currentRoundIndex === TOTAL_ROUNDS - 1){
      nextBtn.textContent = 'See final score';
    } else {
      nextBtn.textContent = 'Next round';
    }
  }

  function goToNext(){
    resultPanel.classList.remove('open');
    if(currentRoundIndex === TOTAL_ROUNDS - 1){
      setTimeout(showFinalScreen, 350);
    } else {
      currentRoundIndex++;
      setTimeout(loadRound, 350);
    }
  }

  function rankLabel(score){
    const maxPossible = TOTAL_ROUNDS * 1000;
    const pct = score / maxPossible;
    if(pct >= 0.85) return 'World-class navigator';
    if(pct >= 0.65) return 'Sharp-eyed traveler';
    if(pct >= 0.4) return 'Decent sense of direction';
    if(pct >= 0.2) return 'You\u2019ll get there eventually';
    return 'Bring a compass next time';
  }

  function showFinalScreen(){
    const sorted = roundResults.slice().sort((a,b)=> b.points - a.points);
    let rows = roundResults.map((r,i)=>{
      return `<div class="rank-row"><span class="rn">${i+1}. ${escapeHtml(r.name)}</span><span class="rp">${r.points}</span></div>`;
    }).join('');

    overlayCard.innerHTML = `
      <svg class="overlay-mark" viewBox="0 0 30 42">
        <path d="M15 41 C15 41 3 24.5 3 15 C3 7.2 8.6 1 15 1 C21.4 1 27 7.2 27 15 C27 24.5 15 41 15 41 Z"
              fill="#E0703A" stroke="#7a2f14" stroke-width="1.5"/>
        <circle cx="15" cy="15" r="5.5" fill="#fff5ea"/>
      </svg>
      <div class="overlay-title">Journey<br>complete<span class="q">.</span></div>
      <div class="final-score">${totalScore.toLocaleString()}</div>
      <div class="final-label">out of ${(TOTAL_ROUNDS*1000).toLocaleString()} \u2014 ${rankLabel(totalScore)}</div>
      <div class="rank-list">${rows}</div>
      <button class="btn btn-primary" id="playAgainBtn">Play again</button>
    `;
    overlay.classList.remove('hidden');
    document.getElementById('playAgainBtn').addEventListener('click', startGame);
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function showStartScreen(){
    overlayCard.innerHTML = `
      <svg class="overlay-mark" viewBox="0 0 30 42">
        <path d="M15 41 C15 41 3 24.5 3 15 C3 7.2 8.6 1 15 1 C21.4 1 27 7.2 27 15 C27 24.5 15 41 15 41 Z"
              fill="#F2B84B" stroke="#8a611c" stroke-width="1.5"/>
        <circle cx="15" cy="15" r="5.5" fill="#fff5ea"/>
      </svg>
      <div class="overlay-title">Where'd you<br>land<span class="q">?</span></div>
      <div class="overlay-sub">You'll get ${TOTAL_ROUNDS} famous places, one at a time. Click the world map where you think each one is \u2014 the closer your pin, the more points you score. Up to 1,000 per round.</div>
      <button class="btn btn-primary" id="startBtn">Start game</button>
    `;
    overlay.classList.remove('hidden');
    document.getElementById('startBtn').addEventListener('click', startGame);
  }

  // ---------- wire up events ----------
  svg.addEventListener('click', onMapClick);
  guessBtn.addEventListener('click', lockInGuess);
  nextBtn.addEventListener('click', goToNext);

  let resizeTimer = null;
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(repositionAllMarkers, 100);
  });

  showStartScreen();
})();
</script>
